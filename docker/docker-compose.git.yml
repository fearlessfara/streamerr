# Build & run Streamerr from the public GitHub repository.
# Keep a local .env at the repository root (or create a folder with this compose file + .env).
#
#   cp .env.example .env   # fill in Jellyfin / Seerr / Dispatcharr
#   docker compose -f docker/docker-compose.git.yml up -d --build
#
# Image-only (no compose):
#   docker build -t streamerr https://github.com/fearlessfara/streamerr.git
#   docker run --env-file .env -p 8787:8787 -v streamerr-data:/data streamerr

services:
  streamerr:
    build:
      context: https://github.com/fearlessfara/streamerr.git#main
      dockerfile: Dockerfile
    image: streamerr:git
    container_name: streamerr
    ports:
      - "${STREAMERR_PORT:-8787}:8787"
    env_file:
      - ../.env
    environment:
      STREAMERR_DATA_DIR: /data
      STREAMERR_PUBLIC_URL: ${STREAMERR_PUBLIC_URL:-http://localhost:8787}
    volumes:
      - streamerr-data:/data
    restart: unless-stopped

volumes:
  streamerr-data:
